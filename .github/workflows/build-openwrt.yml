name: OpenWrt 25.12.4 大内存防爆版 完整功能无删减

on:
  workflow_dispatch:
    inputs:
      CONFIG_FILE:
        description: 配置文件
        required: false
        default: '.config'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取 Lienol 最新稳定代码
        uses: actions/checkout@v4.2.2
        with:
          repository: Lienol/openwrt
          ref: openwrt-25.12
          fetch-depth: 0

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib \
          gettext git gperf libtool libncurses5-dev libssl-dev libelf-dev make nano ncurses-dev \
          openssl patch pkgconf python3 python3-pip python3-setuptools python3-wheel qemu-utils rsync \
          scons squashfs-tools subversion swig texinfo uglifyjs unzip zlib1g-dev

      - name: Git 网络优化
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.timeout 300

      - name: 编译缓存
        uses: actions/cache@v4.2.2
        with:
          path: |
            .ccache
            dl
          key: ${{ runner.os }}-openwrt-bigmem-${{ hashFiles('**/.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-bigmem-

      - name: 添加全套稳定插件源
        run: |
          sed -i 's_downloads.openwrt.org_mirrors.ustc.edu.cn/openwrt_' feeds.conf.default
          cat >> feeds.conf.default << 'EOF'
          src-git lienol https://github.com/Lienol/openwrt-package
          src-git lean https://github.com/coolsnowwolf/packages
          src-git passwall https://github.com/xiaorouji/openwrt-passwall
          src-git passwall2 https://github.com/xiaorouji/openwrt-passwall2
          src-git openclash https://github.com/vernesong/OpenClash
          src-git adguardhome https://github.com/rufengsuixing/luci-app-adguardhome
          src-git dockerman https://github.com/lisaac/luci-app-dockerman
          src-git nas https://github.com/linkease/nas-packages
          src-git nas_luci https://github.com/linkease/nas-packages-luci
          src-git theme https://github.com/rosywrt/luci-theme-rosy
          src-git helloworld https://github.com/fw876/helloworld
          src-git ddns https://github.com/linkease/ddnsto
          src-git alist https://github.com/chenmozhijin/luci-app-alist
          src-git filemanager https://github.com/immortalwrt/luci-app-filemanager
          src-git pushbot https://github.com/zzsj0928/luci-app-pushbot
          src-git clouddrive https://github.com/linkease/CloudDrive
          src-git vnt https://github.com/lazygit/openwrt-vnt
          src-git speedtest https://github.com/sirpdboy/luci-app-speedtest
          src-git smartdns https://github.com/pymumu/openwrt-smartdns
          src-git smartdns-luci https://github.com/pymumu/luci-app-smartdns
          src-git guestnetwork https://github.com/sirpdboy/luci-app-guestwifi
          src-git qbittorrent https://github.com/kingonion/luci-app-qbittorrent
          src-git dnsfilter https://github.com/destan19/OpenAppFilter
          src-git autoshutdown https://github.com/sirpdboy/luci-app-autopoweroff
          src-git shortcut https://github.com/sirpdboy/luci-app-control-weburl
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 大内存专属系统调优 + 进程限制 + ZRAM
        run: |
          cat >> package/base-files/files/etc/profile << 'EOF'
          ulimit -m 2097152
          ulimit -v 2097152
          ulimit -n 65535
          ulimit -u 8192
          EOF

          cat >> package/base-files/files/etc/sysctl.conf << 'EOF'
          vm.swappiness=40
          vm.min_free_kbytes=131072
          vm.overcommit_memory=0
          vm.dirty_ratio=30
          vm.dirty_background_ratio=15
          vm.dirty_expire_centisecs=3000
          vm.oom_kill_allocating_task=0
          net.ipv4.tcp_tw_reuse=1
          net.ipv4.tcp_syncookies=1
          EOF

          cat >> package/base-files/files/etc/rc.local << 'EOF'
          modprobe zram
          echo lz4 > /sys/block/zram0/comp_algorithm
          echo 1024M > /sys/block/zram0/disksize
          mkswap /dev/zram0
          swapon /dev/zram0
          EOF

          make defconfig

      - name: 启用ZRAM模块 + 编译优化
        run: |
          echo "CONFIG_PACKAGE_zram-swap=y" >> .config
          echo "CONFIG_PACKAGE_kmod-zram=y" >> .config
          echo "CONFIG_TARGET_OPTIONS=y" >> .config
          echo "CONFIG_TARGET_OPTIMIZATION=\"-O2\"" >> .config
          make defconfig

      - name: 注入应用商店
        run: |
          echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
          echo "CONFIG_PACKAGE_opkg=y" >> .config
          echo "CONFIG_PACKAGE_opkg-conf=y" >> .config
          echo "CONFIG_PACKAGE_opkg-update=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_wget=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y" >> .config
          sed -i 's/option check_signature\t1/option check_signature\t0/' package/base-files/files/etc/opkg.conf
          make defconfig

      - name: 加载自定义配置
        run: |
          cp ${{ github.event.inputs.CONFIG_FILE }} .config
          make defconfig

      - name: 下载依赖包
        run: |
          make download -j$(nproc)

      - name: 编译固件
        run: |
          make -j$(nproc) V=s LDFLAGS="-O2" CFLAGS="-O2"

      - name: 上传固件
        uses: actions/upload-artifact@v4.2.2
        with:
          name: OpenWrt-25.12.4-BigMem-x86_64
          path: bin/targets/x86/64/
