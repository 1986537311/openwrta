name: 编译 OpenWrt 大内存版（无配置文件版）

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出源码
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          repository: Lienol/openwrt
          ref: 25.12
          fetch-depth: 0
          path: openwrt

      # 2. 优化Git网络
      - name: 优化 Git 网络
        working-directory: ./openwrt
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1

      # 3. 安装依赖
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib \
          gettext git gperf libtool libncurses5-dev libssl-dev libelf-dev make nano ncurses-dev \
          openssl patch pkgconf python3 python3-pip python3-setuptools python3-wheel qemu-utils rsync \
          scons squashfs-tools subversion swig texinfo uglifyjs unzip zlib1g-dev

      # 4. 添加插件源（无红波浪、无解析错误）
      - name: 添加全套稳定插件源
        working-directory: ./openwrt
        run: |
          sed -i 's|https://downloads.openwrt.org|https://mirrors.ustc.edu.cn/openwrt|g' feeds.conf.default
          echo "src-git lean https://github.com/coolsnowwolf/packages" >> feeds.conf.default
          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall" >> feeds.conf.default
          echo "src-git passwall2 https://github.com/xiaorouji/openwrt-passwall2" >> feeds.conf.default
          echo "src-git openclash https://github.com/vernesong/OpenClash" >> feeds.conf.default
          echo "src-git adguardhome https://github.com/rufengsuixing/luci-app-adguardhome" >> feeds.conf.default
          echo "src-git dockerman https://github.com/lisaac/luci-app-dockerman" >> feeds.conf.default
          echo "src-git nas https://github.com/linkease/nas-packages" >> feeds.conf.default
          echo "src-git nas_luci https://github.com/linkease/nas-packages-luci" >> feeds.conf.default
          echo "src-git theme https://github.com/rosywrt/luci-theme-rosy" >> feeds.conf.default
          echo "src-git helloworld https://github.com/fw876/helloworld" >> feeds.conf.default
          echo "src-git ddns https://github.com/linkease/ddnsto" >> feeds.conf.default
          echo "src-git alist https://github.com/chenmozhijin/luci-app-alist" >> feeds.conf.default
          echo "src-git filemanager https://github.com/immortalwrt/luci-app-filemanager" >> feeds.conf.default
          echo "src-git pushbot https://github.com/zzsj0928/luci-app-pushbot" >> feeds.conf.default
          echo "src-git clouddrive https://github.com/linkease/CloudDrive" >> feeds.conf.default
          echo "src-git vnt https://github.com/lazygit/openwrt-vnt" >> feeds.conf.default
          echo "src-git speedtest https://github.com/sirpdboy/luci-app-speedtest" >> feeds.conf.default
          echo "src-git smartdns https://github.com/pymumu/openwrt-smartdns" >> feeds.conf.default
          echo "src-git smartdns-luci https://github.com/pymumu/luci-app-smartdns" >> feeds.conf.default
          echo "src-git guestnetwork https://github.com/sirpdboy/luci-app-guestwifi" >> feeds.conf.default
          echo "src-git qbittorrent https://github.com/kingonion/luci-app-qbittorrent" >> feeds.conf.default
          echo "src-git dnsfilter https://github.com/destan19/OpenAppFilter" >> feeds.conf.default
          echo "src-git autoshutdown https://github.com/sirpdboy/luci-app-autopoweroff" >> feeds.conf.default
          echo "src-git shortcut https://github.com/sirpdboy/luci-app-control-weburl" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. 系统调优（无 here-doc，无红波浪）
      - name: 配置系统调优
        working-directory: ./openwrt
        run: |
          echo "ulimit -m 2097152" >> package/base-files/files/etc/profile
          echo "ulimit -v 2097152" >> package/base-files/files/etc/profile
          echo "ulimit -n 65535" >> package/base-files/files/etc/profile
          echo "ulimit -u 8192" >> package/base-files/files/etc/profile

          echo "vm.swappiness=40" >> package/base-files/files/etc/sysctl.conf
          echo "vm.min_free_kbytes=131072" >> package/base-files/files/etc/sysctl.conf
          echo "vm.overcommit_memory=0" >> package/base-files/files/etc/sysctl.conf
          echo "vm.dirty_ratio=30" >> package/base-files/files/etc/sysctl.conf
          echo "vm.dirty_background_ratio=15" >> package/base-files/files/etc/sysctl.conf
          echo "vm.dirty_expire_centisecs=3000" >> package/base-files/files/etc/sysctl.conf
          echo "vm.oom_kill_allocating_task=0" >> package/base-files/files/etc/sysctl.conf
          echo "net.ipv4.tcp_tw_reuse=1" >> package/base-files/files/etc/sysctl.conf
          echo "net.ipv4.tcp_syncookies=1" >> package/base-files/files/etc/sysctl.conf

          echo "modprobe zram" >> package/base-files/files/etc/rc.local
          echo "echo lz4 > /sys/block/zram0/comp_algorithm" >> package/base-files/files/etc/rc.local
          echo "echo 1024M > /sys/block/zram0/disksize" >> package/base-files/files/etc/rc.local
          echo "mkswap /dev/zram0" >> package/base-files/files/etc/rc.local
          echo "swapon /dev/zram0" >> package/base-files/files/etc/rc.local
          echo "exit 0" >> package/base-files/files/etc/rc.local

          make defconfig

      # 6. 启用ZRAM模块 + 编译优化
      - name: 启用ZRAM与编译优化
        working-directory: ./openwrt
        run: |
          echo "CONFIG_PACKAGE_zram-swap=y" >> .config
          echo "CONFIG_PACKAGE_kmod-zram=y" >> .config
          echo "CONFIG_TARGET_OPTIONS=y" >> .config
          echo "CONFIG_TARGET_OPTIMIZATION=\"-O2\"" >> .config
          make defconfig

      # 7. 注入应用商店
      - name: 注入应用商店
        working-directory: ./openwrt
        run: |
          echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
          echo "CONFIG_PACKAGE_opkg=y" >> .config
          echo "CONFIG_PACKAGE_opkg-conf=y" >> .config
          echo "CONFIG_PACKAGE_opkg-update=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_wget=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y" >> .config
          sed -i 's/option check_signature\t1/option check_signature\t0/' package/base-files/files/etc/opkg.conf
          make defconfig

      # 8. 下载依赖包
      - name: 下载依赖包
        working-directory: ./openwrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -delete

      # 9. 编译固件
      - name: 编译固件
        working-directory: ./openwrt
        run: |
          make -j$(nproc) V=s LDFLAGS="-O2" CFLAGS="-O2"

      # 10. 上传固件
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12.4-BigMem-x86_64
          path: ./openwrt/bin/targets/x86/64/
