name: OpenWrt x86 Build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 * *'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 1986537311/openwrta
          ref: 25.12
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install -y build-essential flex bison git libssl-dev libelf-dev ncurses-dev zlib1g-dev gawk gettext unzip file lib32gcc-s1 python3

      - name: Setup Feeds
        run: |
          cd $GITHUB_WORKSPACE
          cat > feeds.conf.default <<'END'
          src-git base https://git.openwrt.org/openwrt/openwrt.git;openwrt-25.12
          src-git packages https://git.openwrt.org/feed/packages.git;openwrt-25.12
          src-git luci https://git.openwrt.org/project/luci.git;openwrt-25.12
          src-git helloworld https://github.com/fw876/helloworld.git;main
          src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main
          src-git openclash https://github.com/vernesong/OpenClash.git;master
          END
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Firmware
        run: |
          cd $GITHUB_WORKSPACE
          cat > .config <<'END'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-aria2=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-app-syncthing=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-cpufreq=y
          END
          make defconfig
          make -j$(nproc) download

      - name: Compile
        run: |
          cd $GITHUB_WORKSPACE
          make -j$(nproc) V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86
          path: bin/targets/x86/64/openwrt-x86_64-combined-squashfs.img.gz

