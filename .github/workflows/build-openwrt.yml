name: Build OpenWrt x86 All-In-One Firmware
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 * *'  # 每月1号凌晨2点自动编译更新
  push:
    branches:
      - 25.12

env:
  REPO_URL: https://github.com/1986537311/openwrt
  REPO_BRANCH: 25.12
  CONFIG_FILE: .config
  DIY_SCRIPT: diy-part1.sh
  DIY_PART2: diy-part2.sh
  TARGET: x86
  SUBTARGET: 64
  IMAGE_NAME: openwrt-x86_64-combined-squashfs

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_URL }}
          ref: ${{ env.REPO_BRANCH }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y \
          build-essential flex bison git-core libssl-dev libelf-dev \
          ncurses-dev zlib1g-dev gawk gettext unzip file lib32gcc-s1 \
          libc6-dev-i386 python3 python3-pip qemu-utils genisoimage

      - name: Update feeds and install packages
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run pre-build customization (diy-part1.sh)
        run: |
          cat > diy-part1.sh << 'EOF'
          #!/bin/bash
          # 1. 添加第三方软件源
          echo "src-git helloworld https://github.com/fw876/helloworld.git;main" >> feeds.conf.default
          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main" >> feeds.conf.default
          echo "src-git small https://github.com/kenzok8/small.git" >> feeds.conf.default
          echo "src-git smallpackage https://github.com/kenzok8/small-package.git" >> feeds.conf.default
          echo "src-git openclash https://github.com/vernesong/OpenClash.git;master" >> feeds.conf.default
          echo "src-git luci-app-fileassistant https://github.com/linkease/luci-app-fileassistant.git;main" >> feeds.conf.default
          echo "src-git luci-app-cloudreve https://github.com/cloudreve/luci-app-cloudreve.git;main" >> feeds.conf.default
          echo "src-git luci-app-v2raya https://github.com/v2rayA/luci-app-v2raya.git;main" >> feeds.conf.default

          # 2. 更新并安装第三方源
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 3. 安装全家桶依赖
          # Docker全家桶依赖
          opkg install docker dockerd luci-app-dockerman luci-i18n-dockerman-zh-cn containerd cgroupfs-mount kmod-docker
          # 游戏防封全家桶依赖
          opkg install luci-app-openclash luci-app-passwall luci-app-passwall2 luci-app-ssr-plus luci-app-bypass luci-app-v2raya
          # 手机备份全家桶依赖
          opkg install luci-app-fileassistant luci-app-cloudreve luci-app-aria2 luci-app-rsync luci-app-nas luci-app-syncthing luci-i18n-syncthing-zh-cn
          # 商店全家桶依赖
          opkg install luci-app-opkg luci-app-store luci-app-luci-app-store luci-i18n-luci-app-store-zh-cn
          # 基础网络工具
          opkg install luci-app-firewall luci-app-upnp luci-app-nlbwmon luci-app-statistics luci-app-ttyd luci-app-cpufreq luci-app-advanced-reboot
          EOF
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: Generate .config (x86 64 + 全家桶完整配置)
        run: |
          cat > $CONFIG_FILE << 'EOF'
          # 基础系统配置
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_IMAGES_ISO=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-theme-design=y
          CONFIG_PACKAGE_luci-theme-material=y

          # 商店全家桶
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-luci-app-store=y
          CONFIG_PACKAGE_luci-i18n-luci-app-store-zh-cn=y
          CONFIG_PACKAGE_luci-app-appfilter=y
          CONFIG_PACKAGE_luci-app-autoreboot=y
          CONFIG_PACKAGE_luci-app-advanced-reboot=y
          CONFIG_PACKAGE_luci-app-advancedsettings=y

          # Docker全家桶
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_containerd=y
          CONFIG_PACKAGE_docker-compose=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y
          CONFIG_PACKAGE_kmod-docker=y
          CONFIG_PACKAGE_cgroupfs-mount=y
          CONFIG_PACKAGE_dockerd-docker=y
          CONFIG_PACKAGE_docker-cli=y
          CONFIG_PACKAGE_luci-app-docker=y
          CONFIG_PACKAGE_luci-app-dockerman-full=y

          # 游戏防封/网络优化全家桶
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y
          CONFIG_PACKAGE_luci-app-ssr-plus=y
          CONFIG_PACKAGE_luci-i18n-ssr-plus-zh-cn=y
          CONFIG_PACKAGE_luci-app-bypass=y
          CONFIG_PACKAGE_luci-i18n-bypass-zh-cn=y
          CONFIG_PACKAGE_luci-app-v2raya=y
          CONFIG_PACKAGE_luci-i18n-v2raya-zh-cn=y
          CONFIG_PACKAGE_luci-app-flowoffload=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-nft-qos=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_kmod-tls=y
          CONFIG_PACKAGE_kmod-netfilter-fullcone=y
          CONFIG_PACKAGE_fullcone=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_iptables-mod-fullconenat=y

          # 手机备份/NAS全家桶
          CONFIG_PACKAGE_luci-app-fileassistant=y
          CONFIG_PACKAGE_luci-app-cloudreve=y
          CONFIG_PACKAGE_luci-app-aria2=y
          CONFIG_PACKAGE_luci-i18n-aria2-zh-cn=y
          CONFIG_PACKAGE_luci-app-rsync=y
          CONFIG_PACKAGE_luci-app-syncthing=y
          CONFIG_PACKAGE_luci-i18n-syncthing-zh-cn=y
          CONFIG_PACKAGE_luci-app-nas=y
          CONFIG_PACKAGE_luci-app-transmission=y
          CONFIG_PACKAGE_luci-app-qbittorrent=y
          CONFIG_PACKAGE_luci-app-minidlna=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-app-cifs-mount=y
          CONFIG_PACKAGE_luci-app-nfs=y
          CONFIG_PACKAGE_samba4-server=y
          CONFIG_PACKAGE_samba4-libs=y
          CONFIG_PACKAGE_cifs-utils=y
          CONFIG_PACKAGE_nfs-kernel-server=y
          CONFIG_PACKAGE_syncthing=y
          CONFIG_PACKAGE_cloudreve=y
          CONFIG_PACKAGE_fileassistant=y

          # 系统工具全家桶
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-cpufreq=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-ipsec-vpnserver-manyusers=y
          CONFIG_PACKAGE_luci-app-openvpn-server=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_luci-app-adblock=y
          CONFIG_PACKAGE_luci-app-hosts=y
          CONFIG_PACKAGE_luci-app-iptvhelper=y
          CONFIG_PACKAGE_luci-app-kodexplorer=y
          CONFIG_PACKAGE_luci-app-onliner=y
          CONFIG_PACKAGE_luci-app-poweroff=y
          CONFIG_PACKAGE_luci-app-rebootscheduler=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_luci-app-softethervpn=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_luci-app-webadmin=y
          CONFIG_PACKAGE_luci-app-webshell=y
          CONFIG_PACKAGE_luci-app-wifidog=y
          CONFIG_PACKAGE_luci-app-wifischedule=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_luci-app-iptvhelper=y
          CONFIG_PACKAGE_luci-app-kodexplorer=y
          CONFIG_PACKAGE_luci-app-filebrowser=y
          CONFIG_PACKAGE_filebrowser=y
          EOF
          ./scripts/feeds install -a
          make defconfig
          make -j$(nproc) download

      - name: Run post-build customization (diy-part2.sh)
        run: |
          cat > diy-part2.sh << 'EOF'
          #!/bin/bash
          # 1. 修改默认IP为192.168.1.1
          sed -i 's/192.168.1.1/192.168.1.1/g' package/base-files/files/bin/config_generate
          # 2. 开启SSH默认登录
          sed -i 's#/bin/login#/bin/ash#g' package/base-files/files/etc/inittab
          # 3. 配置Docker开机自启
          echo "docker enable" >> package/base-files/files/etc/rc.local
          echo "dockerd enable" >> package/base-files/files/etc/rc.local
          # 4. 配置OpenClash开机自启
          echo "/etc/init.d/openclash enable" >> package/base-files/files/etc/rc.local
          # 5. 配置Samba/文件共享开机自启
          echo "/etc/init.d/samba4 enable" >> package/base-files/files/etc/rc.local
          echo "/etc/init.d/aria2 enable" >> package/base-files/files/etc/rc.local
          echo "/etc/init.d/syncthing enable" >> package/base-files/files/etc/rc.local
          EOF
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: Compile firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86-AllInOne-Firmware
          path: bin/targets/x86/64/${IMAGE_NAME}.img.gz
          retention-days: 30
