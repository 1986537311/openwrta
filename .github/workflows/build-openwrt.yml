name: 编译 x86 游戏防封固件

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 清理磁盘空间
      - name: 清理磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 2. 获取代码
      - name: 检出代码
        uses: actions/checkout@v3

      # 3. 准备环境
      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 aria2 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsk mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      # 4. 配置插件源
      - name: 配置软件源
        run: |
          rm -rf ./feeds.conf.default
          echo "src-git packages https://github.com/openwrt/packages.git;openwrt-23.05" >> feeds.conf.default
          echo "src-git luci https://github.com/openwrt/luci.git;openwrt-23.05" >> feeds.conf.default
          echo "src-git routing https://github.com/openwrt/routing.git;openwrt-23.05" >> feeds.conf.default
          echo "src-git telephony https://github.com/openwrt/telephony.git;openwrt-23.05" >> feeds.conf.default
          # 添加商店源
          echo "src-git store https://github.com/istore/istore" >> feeds.conf.default
          # 添加 PassWall 源（游戏多开核心）
          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall" >> feeds.conf.default
          echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages" >> feeds.conf.default

      # 5. 下载插件
      - name: 更新并安装软件源
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p store
          # 安装 PassWall 相关组件
          ./scripts/feeds install -d y luci-app-passwall
          ./scripts/feeds install -d y luci-app-passwall_packages

      # 6. 写入配置
      - name: 写入配置文件
        run: |
          # 复制配置模板（这里假设你根目录有一个 .config 文件，如果没有，它会使用默认配置）
          # 如果没有自定义 .config 文件，这一步会生成一个默认的 x86 配置
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          # 开启商店
          echo "CONFIG_PACKAGE_luci-app-istore=y" >> .config
          # 开启 PassWall
          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
          # 开启常用游戏/防封工具
          echo "CONFIG_PACKAGE_ipset=y" >> .config
          echo "CONFIG_PACKAGE_iptables-mod-tproxy=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
          echo "CONFIG_PACKAGE_chinadns-ng=y" >> .config
          # 开启 IPv6 支持
          echo "CONFIG_PACKAGE_ip6tables=y" >> .config
          # 优化设置
          echo "CONFIG_PACKAGE_luci-compat=y" >> .config
          echo "CONFIG_PACKAGE_luci-lib-ipkg=y" >> .config
          # 默认主题
          echo "CONFIG_LUCI_LANG_zh-cn=y" >> .config
          # 读取默认配置并更新
          make defconfig

      # 7. 开始编译
      - name: 编译固件
        run: |
          echo "编译开始..."
          make download -j$(nproc)
          make -j$(nproc)

      # 8. 上传固件
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_x86_64_Firmware
          path: bin/targets/
