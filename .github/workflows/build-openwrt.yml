name: Build x86 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 清理磁盘空间
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 2. 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 3. 初始化环境
      - name: Init environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gcc-multilib g++-multilib gettext git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      # 4. 配置 Feeds 源
      - name: Configure feeds
        run: |
          echo "src-git packages https://github.com/openwrt/packages.git;openwrt-23.05" > feeds.conf
          echo "src-git luci https://github.com/openwrt/luci.git;openwrt-23.05" >> feeds.conf
          echo "src-git routing https://github.com/openwrt/routing.git;openwrt-23.05" >> feeds.conf
          echo "src-git telephony https://github.com/openwrt/telephony.git;openwrt-23.05" >> feeds.conf
          # 添加 Lienol 商店源
          echo "src-git lienol https://github.com/Lienol/openwrt-package.git" >> feeds.conf

      # 5. 更新并安装 Feeds
      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 单独确保安装商店插件
          ./scripts/feeds install luci-app-store

      # 6. 写入配置文件
      - name: Write config file
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_PROFILE=DEVICE_generic
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-i18n-store-zh-cn=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_kmod-nfnetlink=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_vim-full=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF

      # 7. 编译固件
      - name: Compile firmware
        id: compile
        run: |
          make -j$(nproc) download
          make -j$(nproc) || exit 1
          mkdir -p output
          cp bin/targets/x86/64/* output/

      # 8. 上传固件
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86-firmware
          path: output/
