name: 编译 x86_64 固件

on:
  workflow_dispatch:
  # 取消下面两行的注释，可以定时自动编译（每3天一次）
  # schedule:
  #   - cron: '0 20 */3 * *'

env:
  REPO_URL: https://github.com/1986537311/openwrt.git
  REPO_BRANCH: 25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 🧹 清理磁盘空间
      run: |
        sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost
        sudo apt-get autoremove -y >/dev/null
        sudo apt-get clean
        df -h

    - name: 📦 安装编译依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential clang flex gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-distutils \
          rsync swig unzip wget xsltproc zlib1g-dev ccache ecj

    - name: 📥 克隆源码
      run: |
        git clone -b $REPO_BRANCH --single-branch $REPO_URL openwrt
        ln -sf openwrt/* .
        ls openwrt

    - name: ➕ 添加 Lienol 扩展源
      run: |
        cd openwrt
        echo "src-git lienol https://github.com/Lienol/openwrt-package.git" >> feeds.conf.default

    - name: 🔄 更新 & 安装 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: ⚙️ 写入 x86_64 配置
      run: |
        cd openwrt
        cat > .config << 'EOF'
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_generic=y
        CONFIG_DEVEL=y
        CONFIG_CCACHE=y
        CONFIG_GRUB_IMAGES=y
        CONFIG_EFI_IMAGES=y
        CONFIG_VMDK_IMAGES=y
        CONFIG_LUCI_LANG_zh_Hans=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-opkg=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_luci-app-upnp=y
        CONFIG_PACKAGE_luci-app-wol=y
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_luci-app-openclash=y
        CONFIG_PACKAGE_luci-app-adguardhome=y
        CONFIG_PACKAGE_wget-ssl=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_ip-full=y
        EOF
        make defconfig

    - name: 📦 预下载
      run: |
        cd openwrt
        make download -j8

    - name: 🔨 开始编译
      run: |
        cd openwrt
        make -j$(nproc) V=s 2>&1 | tee build.log

    - name: 📤 上传固件
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: openwrt-x86_64-firmware
        path: openwrt/bin/targets/x86/64/*

