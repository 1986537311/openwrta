name: OpenWrt v25.12.4 官方稳定版 + 全插件源

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 配置 Git 全局环境
        run: |
          git config --global advice.detachedHead false
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      - name: 检出基础环境
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential gcc g++ make cmake autoconf automake libtool pkg-config libncurses5-dev libssl-dev libxml2-dev libreadline-dev git wget curl unzip bzip2 xz-utils zlib1g-dev python3 python3-pip perl rsync subversion

      - name: 拉取官方 v25.12.4 稳定版源码
        run: |
          mkdir openwrt && cd openwrt
          git init
          git remote add origin https://git.openwrt.org/openwrt/openwrt.git
          git fetch --depth=1 origin v25.12.4
          git checkout FETCH_HEAD

      - name: 缓存编译文件 提速防超时
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/build_dir
          key: openwrt-25.12.4-stable-full-${{ github.sha }}
          restore-keys: openwrt-25.12.4-stable-

      - name: 配置 Feeds（官方+全部稳定插件源）
        working-directory: ./openwrt
        run: |
          cp feeds.conf.default feeds.conf.default.bak
          > feeds.conf.default
          echo "src-git packages https://git.openwrt.org/feed/packages.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git luci https://git.openwrt.org/feed/luci.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git routing https://git.openwrt.org/feed/routing.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git telephony https://git.openwrt.org/feed/telephony.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git;master" >> feeds.conf.default
          echo "src-git kenzok8_small https://github.com/kenzok8/small.git;master" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 初始化基础配置
        working-directory: ./openwrt
        run: |
          make defconfig

      - name: 配置系统 中文+商店+x86_64
        working-directory: ./openwrt
        run: |
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          echo "CONFIG_LUCI=y" >> .config
          echo "CONFIG_LUCI_LANG_zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
          make defconfig

      - name: 预置国内清华稳定镜像源（纯echo写法，零红波浪）
        working-directory: ./openwrt
        run: |
          rm -f package/base-files/files/etc/apk/repositories.d/distfeeds.list
          echo "https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/25.12.4/targets/x86/64/packages" >> package/base-files/files/etc/apk/repositories.d/distfeeds.list
          echo "https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/25.12.4/packages/x86_64/base" >> package/base-files/files/etc/apk/repositories.d/distfeeds.list
          echo "https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/25.12.4/packages/x86_64/luci" >> package/base-files/files/etc/apk/repositories.d/distfeeds.list
          echo "https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/25.12.4/packages/x86_64/packages" >> package/base-files/files/etc/apk/repositories.d/distfeeds.list
          echo "https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/25.12.4/packages/x86_64/routing" >> package/base-files/files/etc/apk/repositories.d/distfeeds.list
          echo "https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/25.12.4/packages/x86_64/telephony" >> package/base-files/files/etc/apk/repositories.d/distfeeds.list

      - name: 预下载依赖包
        working-directory: ./openwrt
        run: |
          make download -j$(nproc)

      - name: 编译固件
        working-directory: ./openwrt
        run: |
          make -j$(nproc) V=s

      - name: 上传成品固件
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-v25.12.4-全稳定插件源
          path: openwrt/bin/targets/x86/64/
