name: OpenWrt x86_64 全插件固件

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
  schedule:
    - cron: 0 2 1 * *

env:
  REPO_URL: https://github.com/Lienol/openwrt
  REPO_BRANCH: 25.12
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查磁盘空间
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile

    - name: 拉取源码
      uses: actions/checkout@main
      with:
        repository: ${{ env.REPO_URL }}
        ref: ${{ env.REPO_BRANCH }}
        fetch-depth: 0

    - name: 生成配置文件
      run: |
        rm -f .config
        touch .config

        # ---------------- 系统基础配置 ----------------
        echo "CONFIG_TARGET_x86=y" >> .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_GENERIC=y" >> .config
        echo "CONFIG_TARGET_PROFILE=DEVICE_generic" >> .config
        echo "CONFIG_TARGET_PACKAGES=" >> .config
        echo "CONFIG_DEVEL=y" >> .config
        echo "CONFIG_CCACHE=y" >> .config
        echo "CONFIG_IB=y" >> .config

        # ---------------- LuCI 基础 ----------------
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
        echo "CONFIG_PACKAGE_luci-base=y" >> .config
        echo "CONFIG_PACKAGE_luci-mod-admin-full=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-samba=y" >> .config

        # ---------------- iStore 应用商店 ----------------
        echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-store-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_istore=y" >> .config
        echo "CONFIG_PACKAGE_istore-core=y" >> .config
        echo "CONFIG_PACKAGE_istore-web=y" >> .config

        # ---------------- 四大家桶 (PassWall/OpenClash) ----------------
        echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-passwall2=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-ssr-plus=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-vssr=y" >> .config

        # ---------------- 游戏加速全家桶 ----------------
        echo "CONFIG_PACKAGE_luci-app-ipsec-server=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-xlnetacc=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-games=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-nps=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-frpc=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-ddns=y" >> .config

        # ---------------- 手机备份/应用全家桶 ----------------
        echo "CONFIG_PACKAGE_luci-app-usb-printer=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-ramfree=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-cpufreq=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-autoreboot=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-wol=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-diskman=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-sqm=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-unblockneteasemusic=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> .config

        # ---------------- Docker 全家桶 ----------------
        echo "CONFIG_PACKAGE_dockerd=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-docker=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
        echo "CONFIG_PACKAGE_luci-lib-docker=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-docker-compose=y" >> .config
        echo "CONFIG_PACKAGE_docker-compose=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-iptvhelper=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nfnetlink_queue=y" >> .config

        # ---------------- 其他常用工具 ----------------
        echo "CONFIG_PACKAGE_luci-app-smartdns=y" >> .config
        echo "CONFIG_PACKAGE_smartdns=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-advanced=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-fileassistant=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-zerotier=y" >> .config

    - name: 更新 feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config

    - name: 下载 dl 库
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 上传固件
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@main
      with:
        name: OpenWrt_x86_64${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}_firmware
        path: openwrt/bin/targets/
