name: 编译 x86 游戏防封固件

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 清理磁盘空间
      - name: 清理磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 2. 获取源码
      - name: 检出代码
        uses: actions/checkout@v3

      # 3. 准备编译环境
      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 aria2 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      # 4. 配置 feeds
      - name: 配置 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. 加载自定义配置 (全家桶 + 手机备份)
      - name: 加载自定义配置
        run: |
          # 这里假设你在仓库根目录放了 .config 文件
          # 如果你没有上传 .config 文件，这一步会复制默认配置
          if [ -f .config ]; then
            cp .config .config.old
          else
            # 如果没有配置文件，生成一个默认的 x86 配置
            make defconfig
          fi

          # --- 在这里注入全家桶和手机备份插件 ---
          # 开启 LuCI 应用
          echo "CONFIG_PACKAGE_luci=y" >> .config
          # 开启 iStore 应用商店 (全家桶核心)
          echo "CONFIG_PACKAGE_luci-app-istore=y" >> .config
          # 开启 NPS 内网穿透 (手机备份核心)
          echo "CONFIG_PACKAGE_luci-app-nps=y" >> .config
          # 开启其他常用全家桶插件
          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-frpc=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> .config

          # 再次更新配置以解决依赖
          make defconfig

      # 6. 下载 dl 源码
      - name: 下载 dl 源码
        run: make download -j8

      # 7. 开始编译
      - name: 开始编译固件
        run: |
          make -j$(nproc)

      # 8. 整理固件
      - name: 整理固件
        run: |
          mkdir -p output
          cp bin/targets/x86/64/*.* output/

      # 9. 上传固件 (关键修复：v3 改为 v4)
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86-firmware
          path: output/
