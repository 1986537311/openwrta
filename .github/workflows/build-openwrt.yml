name: Build x86_64 with Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 清理磁盘空间
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 2. 检出代码
      - name: Checkout
        uses: actions/checkout@v3

      # 3. 安装基础依赖
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      # 4. 加载缓存 (加速编译)
      - name: Cache
        uses: actions/cache@v3
        with:
          path: |
            .config
            dl
            staging_dir
            build_dir
          key: ${{ runner.os }}-openwrt-${{ hashFiles('.config') }}

      # 5. 【关键步骤】配置编译选项并加入商店插件
      - name: Configure Build
        run: |
          # 下载 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 生成默认配置
          # 如果你的仓库根目录有 .config 文件，这一步会读取它
          # 如果没有，它会生成一个默认的最小配置
          make defconfig
          
          # 【核心命令】向配置文件追加内容
          # 选择 x86_64 架构
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          
          # 开启 LuCI 界面
          echo "CONFIG_PACKAGE_luci=y" >> .config
          
          # 【重点】加入软件商店 (luci-app-store)
          echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
          
          # 显示最终配置
          cat .config

      # 6. 开始编译
      - name: Build Firmware
        run: |
          make -j$(nproc)
          
      # 7. 上传固件
      - name: Upload Firmware
        uses: actions/upload-artifact@v3
        with:
          name: OpenWrt-x86-64-Firmware
          path: bin/targets/x86/64/
